const fresh=()=>({m:50,sold:0,xp:0,lvl:1,rate:3,L:{dry:1,batch:0,spd:0,pr:0,mk:0},stock:Array(16).fill(0),cnt:Array(16).fill(0),slots:[null],q:[],sel:0,nc:6,W:{cook:0,seller:0},wt:{cook:0,seller:0},wo:[],nw:70,evt:null,nev:60,ach:[],day:'',dt:[],stats:{income:0,expenses:0},factories:{workshop:0,factory:0,mega:0},lday:'',streak:0,ts:0,rev:[]});
let S=fresh();

const U={
 dry:{n:'Сушарка',d:'Ще одна партія одночасно',c:l=>Math.round(150*Math.pow(2.2,l-1)),max:8,v:l=>l},
 batch:{n:'Розмір партії',d:'Більше пакетів з однієї партії',c:l=>Math.round(80*Math.pow(1.75,l)),max:14,v:l=>4+l*2},
 spd:{n:'Швидкість сушіння',d:'Партії готуються швидше',c:l=>Math.round(90*Math.pow(1.9,l)),max:10,v:l=>(dryTime()).toFixed(1)+' с'},
 pr:{n:'Стильна упаковка',d:'+10% до ціни кожного пакета',c:l=>Math.round(130*Math.pow(2,l)),max:10,v:l=>'+'+l*10+'%'},
 mk:{n:'Реклама в Instagram',d:'Клієнти приходять частіше',c:l=>Math.round(110*Math.pow(2,l)),max:10,v:l=>'кожні '+custInt().toFixed(1)+' с'}
};
const dryTime=()=>10*Math.pow(.86,S.L.spd);
const custInt=()=>9*Math.pow(.85,S.L.mk)*(1.5-S.rate*.14)*(S.evt&&S.evt.k==='fest'?.5:S.evt&&S.evt.k==='vir'?.7:1);
const batchN=()=>4+S.L.batch*2;
const mult=()=>(1+S.L.pr*.1)*(.85+S.rate*.05);
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.floor(n);
function earn(n){if(n>0){S.m+=n;S.stats.income+=n;popMoney()}}
function spend(n){if(n>0&&S.m>=n){S.m-=n;S.stats.expenses+=n;return true}return false}
let toastTimer;
function notify(title,message,important=false){const el=$('toast');if(el){el.innerHTML=`<b>${tr(title)}</b><div>${tr(message)}</div>`;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),5200)}if(important&&'Notification'in window&&Notification.permission==='granted'){try{new Notification(tr(title),{body:tr(message)})}catch(e){}}}
function askNotifications(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().then(v=>{if(v==='granted')notify('Сповіщення увімкнено','Тепер важливі події можуть з’являтися навіть поза грою')});else notify('Сповіщення','Дозвіл браузера: '+(('Notification'in window)?Notification.permission:'не підтримується'))}
function factoryBonus(){return 1+S.factories.workshop*.08+S.factories.factory*.18+S.factories.mega*.35}
const FACT={workshop:{n:'Цех №2',d:'Додатковий виробничий майданчик: +8% до випуску',c:25000},factory:{n:'Велика фабрика',d:'Промислове виробництво: +18% до випуску',c:150000},mega:{n:'Мегафабрика',d:'Максимальний масштаб: +35% до випуску',c:750000}};
const xpNeed=l=>Math.round(12*Math.pow(l,1.5));

const ACH=[
 {n:'50 пакетів продано',ok:()=>S.sold>=50,r:60},
 {n:'500 пакетів продано',ok:()=>S.sold>=500,r:600},
 {n:'5000 пакетів продано',ok:()=>S.sold>=5000,r:6000},
 {n:'Рівень 10',ok:()=>S.lvl>=10,r:400},
 {n:'Рівень 20',ok:()=>S.lvl>=20,r:4000},
 {n:'Рівень 30',ok:()=>S.lvl>=30,r:30000},

function flash(t){note=t;render();setTimeout(()=>{note='';render()},7000)}
function chk(){ACH.forEach((a,i)=>{if(!S.ach.includes(i)&&a.ok()){S.ach.push(i);earn(a.r);sfx('ach');flash('Досягнення: '+a.n+' +$'+a.r)}})}
function daily(){
 const d=new Date().toISOString().slice(0,10);
 if(S.day===d)return;
 S.day=d;
 const ok=F.map((f,i)=>i).filter(i=>S.lvl>=F[i].lv),f=ok[Math.floor(Math.random()*ok.length)],L=S.lvl;
 S.dt=[
  {k:'p',f:f,n:10+L*2,g:0,r:Math.round((10+L*2)*F[f].p*.8)},

  {k:'m',n:Math.round(80*Math.pow(L,1.4)),g:0,r:Math.round(40*Math.pow(L,1.4))+20}
 ];
}
function prog(k,f,v){
 S.dt.forEach(t=>{if(t.k===k&&(k!=='p'||t.f===f)&&t.g<t.n){t.g=Math.min(t.n,t.g+v);if(t.g>=t.n){earn(t.r);flash('Завдання виконано! +$'+t.r)}}});
}
let note='';
function lvlUp(){
 while(S.lvl<30&&S.xp>=xpNeed(S.lvl)){
  S.xp-=xpNeed(S.lvl);S.lvl++;sfx('lvl');buzz([40,40,40]);
  const nf=F.find(f=>f.lv===S.lvl);
  note='Рівень '+S.lvl+'!'+(nf?' Новий смак: '+nf.n:'');notify(S.lvl===30?'Новий етап: фабрики!':'Новий рівень!',S.lvl===30?'Ти досяг 30 рівня. Відкрито виробничі приміщення.':note,true);
  setTimeout(()=>{note='';render()},7000);

}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function addCust(){
 if(S.q.length>=5)return;
 const ok=F.map((f,i)=>i).filter(i=>S.lvl>=F[i].lv);const vip=S.lvl>=3&&Math.random()<.12;
 const f=ok[Math.floor(Math.random()*ok.length)];

 S.q.push({f,qty:vip?qty+3:qty,vip,pat:vip?70:45,max:vip?70:45,name:['Олена','Максим','Іра','Андрій','Софія','Тарас','Оксана','Дмитро'][Math.floor(Math.random()*8)]});
}
function act(a,i){
 if(a==='sel'){S.sel=i}
 else if(a==='gear'){showSet=!showSet}
 else if(a==='cfg'){cfg(i)}
 else if(a==='exp'){codeTxt=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{navigator.clipboard&&navigator.clipboard.writeText(codeTxt).catch(()=>{})}catch(e){}notify('Код збережено','Скопійовано. Збережіть його в нотатках або месенджері.')}
 else if(a==='imp'){impSave()}
 else if(a==='hire'){const w=WK[i],l=S.W[i];if(l<WMAX&&S.m>=w.c(l)){spend(w.c(l));S.W[i]=l+1;chk()}}
 else if(a==='wh'){const o=S.wo[i];if(o&&S.stock[o.f]>=o.qty){S.stock[o.f]-=o.qty;earn(o.pay);floatTxt('+'+fmt(o.pay));S.sold+=o.qty;S.cnt[o.f]+=o.qty;S.xp+=o.qty*(1+o.f);S.rate=Math.min(5,S.rate+.15);S.wo.splice(i,1);prog('p',o.f,o.qty);prog('m',0,o.pay);lvlUp();chk()}}
 else if(a==='cook'){
  const f=F[S.sel],s=S.slots.findIndex(x=>!x);
  if(s>-1&&S.m>=f.c){spend(f.c);sfx('cook');S.slots[s]={f:S.sel,t:0,tot:dryTime()}}
 }
 else if(a==='serve'){
  const c=S.q[i];if(c&&S.stock[c.f]>=c.qty){
   const g=c.qty*F[c.f].p*mult()*(1+c.pat/c.max*.2)*(c.vip?1.8:1);S.stock[c.f]-=c.qty;earn(g);floatTxt('+'+fmt(g));sfx('sell');buzz(15);S.sold+=c.qty;S.cnt[c.f]+=c.qty;S.xp+=c.qty*(1+c.f)*(c.vip?2:1);S.rate=Math.min(5,S.rate+(c.pat/c.max>.5?.06:.02));addRev(c);S.q.splice(i,1);prog('p',c.f,c.qty);prog('c',0,1);prog('m',0,g);lvlUp();chk()}
 }
 else if(a==='up'){
  const u=U[i],l=S.L[i];
  const lv=i==='dry'?l:l+1;
  const cost=u.c(i==='dry'?l:l+1);
  if(l<(i==='dry'?u.max:u.max)&&S.m>=cost){spend(cost);S.L[i]=l+1;if(i==='dry')S.slots.push(null)}
 }
 else if(a==='factory'){const b=FACT[i],l=S.factories[i]||0,cost=b.c*Math.pow(3,l);if(b&&S.lvl>=30&&l<3&&spend(cost)){S.factories[i]=l+1;notify('Нове приміщення відкрито!',b.n+' тепер працює на твою компанію',true)}}
  else if(a==='notify'){askNotifications()}
  else if(a==='reset'){if(confirm(tr('Почати гру заново?'))){S=fresh()}}
 render();save();
}
function render(){
 $('money').textContent=fmt(S.m);
 const mx=S.lvl>=30,need=xpNeed(S.lvl),fl=Math.floor(S.rate);
 let h=settingsHtml()+`<div class="card"><div class="row"><b>Рівень ${S.lvl}${mx?' (макс)':''}</b><span class="stars">${'★'.repeat(fl)}${'☆'.repeat(5-fl)} <small>${S.rate.toFixed(1)}</small></span></div><div class="bar"><i style="width:${mx?100:S.xp/need*100}%"></i></div><div class="mute">${mx?'Ви на вершині!':'Досвід: '+Math.floor(S.xp)+' / '+need}${note?' · '+note:''}</div>${S.evt?`<div class="mute"><b>${EV[S.evt.k]}</b></div>`:''}</div><h2>Кухня</h2><div class="flv">`;
 let shown=false;
 F.forEach((f,i)=>{
  if(S.lvl>=f.lv)h+=`<button class="alt ${S.sel===i?'on':''}" data-a="sel" data-i="${i}">${f.e} ${f.n}</button>`;
  else if(!shown){shown=true;h+=`<button class="alt" disabled>🔒 ${f.n}<br>рівень ${f.lv}</button>`}
 });
 const f=F[S.sel],free=S.slots.some(x=>!x);
 h+=`</div><div class="card"><div class="row"><div><b>${f.e} ${f.n}</b><div class="mute">Партія: ${batchN()} пакетів, закупівля ${fmt(f.c)}</div></div>
 <button data-a="cook" ${(!free||S.m<f.c)?'disabled':''}>Запустити</button></div></div>`;
 S.slots.forEach((s,i)=>{
  h+=`<div class="card"><div class="row"><span>Сушарка ${i+1}</span><span class="mute">${s?F[s.f].e+' '+F[s.f].n:'вільна'}</span></div>${s?`<div class="bar"><i data-p="${i}"></i></div>`:''}</div>`;
 });
 h+='<h2>Склад</h2><div class="stock">'+F.map((f,i)=>S.lvl>=f.lv?`<span>${f.e} ${S.stock[i]}</span>`:'').join('')+'</div>';
 h+='<h2>Клієнти</h2>';
 if(!S.q.length)h+='<div class="card mute">Поки нікого. Скоро хтось прийде.</div>';
 S.q.forEach((c,i)=>{
  const have=S.stock[c.f]>=c.qty;
  h+=`<div class="card"><div class="row"><div><b>${c.vip?'⭐ VIP ':''}${c.name}</b> хоче ${F[c.f].e} ×${c.qty}<div class="mute">${fmt(c.qty*F[c.f].p*mult()*(c.vip?1.8:1))}${have?'':' · не вистачає на складі'}</div></div>
  <button data-a="serve" data-i="${i}" ${have?'':'disabled'}>Продати</button></div><div class="bar pat"><i data-c="${i}"></i></div></div>`;
 });
 if(S.rev.length){h+='<h2>Відгуки клієнтів</h2>'+S.rev.map(r=>`<div class="card"><div class="row"><span><b>${r.n}</b> ${F[r.f].e}</span><span class="stars" style="font-size:14px">${'★'.repeat(r.s)}${'☆'.repeat(5-r.s)}</span></div><div class="mute">«${r.t}»</div></div>`).join('')}
 if(S.wo.length){h+='<h2>Оптові замовлення</h2>';S.wo.forEach((o,i)=>{const okk=S.stock[o.f]>=o.qty;h+=`<div class="card"><div class="row"><div><b>🏪 ${o.name}</b>: ${F[o.f].e} ×${o.qty}<div class="mute">${fmt(o.pay)}${okk?'':' · мало на складі ('+S.stock[o.f]+')'}</div></div><button data-a="wh" data-i="${i}" ${okk?'':'disabled'}>Відправити</button></div><div class="bar pat"><i data-w="${i}"></i></div></div>`})}
 h+='<h2>Завдання дня</h2><div class="mute">🔥 Серія входів: '+S.streak+' дн.</div>';
 S.dt.forEach(t=>{const tx=t.k==='p'?'Продай '+t.n+' × '+F[t.f].e+' '+F[t.f].n:t.k==='c'?'Обслужи '+t.n+' клієнтів':'Заробіти '+fmt(t.n);const m=t.k==='m';h+=`<div class="card"><div class="row"><span>${t.g>=t.n?'✅ ':''}${tx}</span><span class="mute">${m?fmt(t.g):t.g}/${m?fmt(t.n):t.n} · +${fmt(t.r)}</span></div><div class="bar"><i style="width:${t.g/t.n*100}%"></i></div></div>`});
 h+='<h2>Фінанси компанії</h2><div class="card"><div class="statgrid"><div class="statbox"><span class="mute">Усього доходів</span><strong>'+fmt(S.stats.income)+'</strong></div><div class="statbox"><span class="mute">Усього витрат</span><strong>'+fmt(S.stats.expenses)+'</strong></div><div class="statbox"><span class="mute">Чистий результат</span><strong style="color:'+(S.stats.income-S.stats.expenses>=0?'var(--ok)':'var(--acc)')+'">'+fmt(S.stats.income-S.stats.expenses)+'</strong></div><div class="statbox"><span class="mute">Гроші зараз</span><strong>'+fmt(S.m)+'</strong></div></div><p class="mute">Статистика накопичується від початку збереження гри.</p></div>';
  if(S.lvl>=30){h+='<h2>🏭 Виробничі приміщення</h2><div class="card factory"><b>Корпоративний масштаб</b><div class="mute">Бонус до випуску продукції: +'+Math.round((factoryBonus()-1)*100)+'%</div></div>';for(const k in FACT){const b=FACT[k],l=S.factories[k]||0,cost=b.c*Math.pow(3,l);h+='<div class="card factory"><div class="row"><div><b>🏭 '+b.n+'</b><div class="mute">'+b.d+'</div><div class="mute">Побудовано: '+l+'/3 · наступне: '+fmt(cost)+'</div></div><button data-a="factory" data-i="'+k+'" '+(l>=3||S.m<cost?'disabled':'')+'>'+(l>=3?'Макс':'Побудувати')+'</button></div></div>'}}
  h+='<h2>Працівники</h2>';
  h+='<div class="card"><div class="row"><div><b>Сповіщення про події</b><div class="mute">Дозволь повідомлення браузера для важливих подій</div></div><button class="alt" data-a="notify">Увімкнути</button></div></div>';
 for(const k in WK){const w=WK[k],l=S.W[k],wm=l>=WMAX;h+=`<div class="card"><div class="row"><div><b>${w.n}</b> <span class="mute">(рівень ${l}${l?', раз на '+wInt(l).toFixed(1)+' с':''})</span><div class="mute">${w.d}</div></div><button data-a="hire" data-i="${k}" ${(wm||S.m<w.c(l))?'disabled':''}>${wm?'Макс':fmt(w.c(l))}</button></div></div>`}
 h+=`<h2>Розвиток</h2>`;
 for(const k in U){
  const u=U[k],l=S.L[k],maxed=l>=u.max,cost=u.c(k==='dry'?l:l+1);
  h+=`<div class="card"><div class="row"><div><b>${u.n}</b> <span class="mute">(${u.v(l)})</span><div class="mute">${u.d}</div></div>
  <button data-a="up" data-i="${k}" ${(maxed||S.m<cost)?'disabled':''}>${maxed?'Макс':fmt(cost)}</button></div></div>`;
 }
 h+=`<h2>Досягнення (${S.ach.length}/${ACH.length})</h2><div class="stock">`+ACH.map((a,i)=>`<span style="${S.ach.includes(i)?'':'opacity:.5'}">${S.ach.includes(i)?'🏆':'🔒'} ${a.n} · ${fmt(a.r)}</span>`).join('')+'</div>';
 h+=`<p class="mute">Продано пакетів: ${S.sold}</p>`;
 $('app').innerHTML=tr(h);
 bars();
}
function bars(){
 S.slots.forEach((s,i)=>{const el=document.querySelector('[data-p="'+i+'"]');if(el&&s)el.style.width=Math.min(100,s.t/s.tot*100)+'%'});
 S.wo.forEach((o,i)=>{const el=document.querySelector('[data-w="'+i+'"]');if(el)el.style.width=Math.max(0,o.left/o.max*100)+'%'});
 S.q.forEach((c,i)=>{const el=document.querySelector('[data-c="'+i+'"]');if(el)el.style.width=Math.max(0,c.pat/c.max*100)+'%'});
}
$('app').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;sfx('tap');
 act(b.dataset.a,b.dataset.i!==undefined&&!isNaN(b.dataset.i)?+b.dataset.i:b.dataset.i);
});
document.querySelector('[data-a="reset"]').addEventListener('click',()=>act('reset'));
let last=Date.now(),sv=0;
setInterval(()=>{
 const now=Date.now(),dt=Math.min(1,(now-last)/1000);last=now;let ev=false;
 const blk=S.evt&&S.evt.k==='blk';S.slots.forEach((s,i)=>{if(s&&!blk){s.t+=dt;if(s.t>=s.tot){S.stock[s.f]+=Math.max(1,Math.floor(batchN()*factoryBonus()));S.slots[i]=null;ev=true}}});
 for(let i=S.q.length-1;i>=0;i--){S.q[i].pat-=dt;if(S.q[i].pat<=0){addRev(S.q[i],1);S.q.splice(i,1);S.rate=Math.max(1,S.rate-.15);ev=true}}
 S.nc-=dt;if(S.nc<=0){addCust();S.nc=custInt()*(.7+Math.random()*.6);ev=true}
 daily();chk();
 if(S.evt){S.evt.t-=dt;if(S.evt.t<=0){notify('Подія завершилася','Компанія повертається до звичайного режиму.');S.evt=null;ev=true}}
 S.nev-=dt;if(S.nev<=0&&!S.evt){const k=['fest','blk','vir'][Math.floor(Math.random()*3)];S.evt={k,t:k==='blk'?15:30};S.nev=70+Math.random()*60;if(k==='vir')S.rate=Math.min(5,S.rate+.5);sfx('evt');notify('Випадкова подія!',EV[k]+(k==='blk'?' — виробництво тимчасово зупинено.':k==='fest'?' — клієнтів стало вдвічі більше.':' — рейтинг компанії зріс.'),true);ev=true}
 S.nw-=dt;if(S.nw<=0){S.nw=80+Math.random()*40;if(S.wo.length<2){const ok=F.map((f,i)=>i).filter(i=>S.lvl>=F[i].lv),f=ok[Math.floor(Math.random()*ok.length)],q=10+Math.floor(S.lvl*1.5)+Math.floor(Math.random()*10);S.wo.push({f,qty:q,pay:Math.round(q*F[f].p*2),left:150,max:150,name:['Магазин «Домашній»','Кав’ярня «Ранок»','Фітнес-клуб «Сила»','Супермаркет «Тут»'][Math.floor(Math.random()*4)]});ev=true}}
 for(let i=S.wo.length-1;i>=0;i--){S.wo[i].left-=dt;if(S.wo[i].left<=0){S.wo.splice(i,1);S.rate=Math.max(1,S.rate-.3);ev=true}}
 for(const k in WK){const l=S.W[k];if(l){S.wt[k]+=dt;if(S.wt[k]>=wInt(l)){S.wt[k]=0;if(k==='cook')act('cook');else{const j=S.q.findIndex(c=>S.stock[c.f]>=c.qty);if(j>-1)act('serve',j)}}}}
 if(ev&&!(showSet&&document.activeElement&&document.activeElement.id==='code'))render();else bars();
 sv+=dt;if(sv>5){sv=0;save()}
},250);
$('gear').addEventListener('click',()=>act('gear'));document.addEventListener('pointerdown',music);document.addEventListener('visibilitychange',music);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline();login();render()}});$('app').addEventListener('input',e=>{if(e.target.id==='code')codeTxt=e.target.value});applyTheme();applyLang();daily();offline();login();render();
